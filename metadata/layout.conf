# For details, see layout.conf in portage(5) and GLEP 82.
# haskell is a master for dev-lang/ghc, which needs that overlay's
# ghc-package and haskell-cabal eclasses rather than Gentoo's older ones.
masters = gentoo haskell
thin-manifests = true
sign-manifests = false
cache-formats = md5-dict
manifest-hashes = BLAKE2B SHA512
manifest-required-hashes = BLAKE2B
eapis-banned = 0 1 2 3 4 5 6
eapis-deprecated = 7
